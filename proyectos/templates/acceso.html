{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | SIGEA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #667eea; --text: #1a1a2e; --border: #e2e8f0; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Inter, sans-serif; color: var(--text); background: linear-gradient(135deg, #eef2ff, #f8fafc 45%, #f5f3ff); }
        .access-card { width: min(100%, 420px); padding: 42px; background: rgba(255,255,255,.96); border: 1px solid var(--border); border-radius: 24px; box-shadow: 0 24px 60px rgba(79,70,229,.15); }
        .brand { font-weight: 800; font-size: 1.6rem; color: var(--primary); margin-bottom: 8px; }
        h1 { font-size: 1.5rem; margin: 0 0 8px; }
        p { color: #64748b; margin: 0 0 28px; line-height: 1.5; }
        label { display: block; font-weight: 700; font-size: .85rem; margin: 18px 0 7px; }
        input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font: inherit; }
        input:focus { outline: 3px solid rgba(102,126,234,.18); border-color: var(--primary); }
        button { width: 100%; margin-top: 26px; padding: 13px; border: 0; border-radius: 10px; color: white; font: 700 .95rem Inter, sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); cursor: pointer; }
        .error { margin-top: 16px; color: #b91c1c; font-size: .9rem; }
    </style>
</head>
<body>
    <main class="access-card">
        <div class="brand">SIGEA</div>
        <h1>Bienvenido</h1>
        <p>Ingresa con la cuenta asignada por tu institución.</p>
        <form method="post">
            {% csrf_token %}
            <label for="id_username">Usuario</label>
            {{ form.username }}
            <label for="id_password">Contraseña</label>
            {{ form.password }}
            {% if form.errors %}<div class="error">Usuario o contraseña incorrectos.</div>{% endif %}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">Ingresar</button>
        </form>
    </main>
</body>
</html>
