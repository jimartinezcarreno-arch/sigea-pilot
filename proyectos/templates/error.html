<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F3F2F1; /* Azure Gray */
            color: #323130; /* Azure Dark */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .error-box {
            background: white;
            border: 2px solid #0078D4; /* Azure Primary */
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            max-width: 500px;
        }
        h2 {
            color: #0078D4;
            margin-bottom: 20px;
        }
        p {
            margin-bottom: 20px;
        }
        .btn {
            background-color: #00BCF2; /* Azure Light */
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover {
            background-color: #0078D4;
        }
    </style>
</head>
<body>
    <div class="error-box">
        <h2>¡Ups! Ocurrió un error</h2>
        <p>{{ mensaje_error }}</p>
        <a href="{% url 'consulta_aulas' %}" class="btn">Volver al inicio</a>
    </div>
</body>
</html>
