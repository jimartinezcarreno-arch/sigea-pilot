<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso restringido | SIGEA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: linear-gradient(135deg, #f8fafc, #eef2ff); font-family: Inter, system-ui, sans-serif; color: #1e293b; }
        main { width: min(92vw, 520px); padding: 42px; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 24px; box-shadow: 0 24px 58px rgba(15, 23, 42, .12); }
        .icon { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%; color: #b45309; background: #fffbeb; font-size: 1.75rem; }
    </style>
</head>
<body>
    <main>
        <div class="icon"><i class="bi bi-shield-lock-fill"></i></div>
        <p class="text-uppercase fw-bold text-warning-emphasis small mb-2">Acceso restringido</p>
        <h1 class="h3 fw-bold">Tu cuenta inici\u00f3 sesi\u00f3n correctamente</h1>
        <p class="text-secondary my-3">{{ detalle }}</p>
        <a class="btn btn-primary px-4" href="{% url 'consulta_aulas' %}"><i class="bi bi-grid-1x2-fill"></i> Ir al tablero</a>
        <a class="btn btn-link text-secondary d-block mt-3" href="{% url 'logout' %}">Cambiar de cuenta</a>
    </main>
</body>
</html>
